#
# The CI pipeline entry point.
#

# The name is parsed by setVersionNumber.js script which then updates the name of the run.
#
# The release branch versions "rnw/*" start with the release number
# such as "0.69." or "0.70." and follow the revision number.
# name: 0.70.$(Rev:r)
#
# The main branch pre-release versions start with "0.0."
# and follow the date and revision number.
name: 0.0.$(Date:yyMM.d)$(Rev:rrr)

# CI and its downstream release run only from main.
trigger:
  batch: true
  branches:
    include:
    - main
pr: none

# Monthly keep-alive run so ADO does not disable the pipeline for inactivity.
# It is not used for real releases and its time is not significant.
# The scheduled CI run also starts the release pipeline.
schedules:
- cron: '0 9 1 * *'
  displayName: Monthly keep-alive
  branches:
    include:
    - main
  always: true

variables:
  - name: tags
    value: production,externalfacing
  - template: codeql-variables.yml

extends:
  template: build-template.yml@self
  parameters:
    # CI builds must publish the binaries and packages.
    MustPublish: true
    # It must be false for real builds. Use true only for debugging.
    FakeBuild: false
