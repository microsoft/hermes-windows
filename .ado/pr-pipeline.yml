#
# The PR pipeline entry point.
#

# It is an input for the setVersionNumber.js script which then updates the name of the run.
name: 0.0.$(Date:yyMM.d)$(Rev:rrr)

# PR validation runs only for changes targeting main.
trigger: none
pr:
  branches:
    include:
    - main

# Monthly keep-alive run so ADO does not disable the pipeline for inactivity.
# It is not used for real releases and its time is not significant.
schedules:
- cron: '0 9 1 * *'
  displayName: Monthly keep-alive
  branches:
    include:
    - main
  always: true

variables:
  - template: codeql-variables.yml

extends:
  template: build-template.yml@self
  parameters:
    # Make sure that the PR builds do not publish signed packages.
    MustPublish: false
    # It must be false for real builds. Use true only for debugging.
    FakeBuild: false
