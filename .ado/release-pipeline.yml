#
# The Release pipeline entry point.
# It releases NuGet packages to the public ms/react-native ADO feed and to
# the NuGet.org feed.
#

name: Release $(Date:yyyyMMdd).$(Rev:r)

# Release runs only after the CI pipeline completes on main.
trigger: none
pr: none

parameters:
- name: enableEsrpNuGetPublishing
  displayName: Publish NuGet.org packages through ESRP
  type: boolean
  # Keep publishing opt-in until the ESRP cutover is validated.
  default: false

resources:
  pipelines:
  - pipeline: CI
    project: ISS
    source: microsoft.hermes-windows.ci
    trigger:
      branches:
        include:
        - main

  repositories:
  - repository: OfficePipelineTemplates
    type: git
    name: 1ESPipelineTemplates/OfficePipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      vmImage: windows-latest
      os: windows
    featureFlags:
      # Incremental analysis removes unchanged production scripts before
      # ESLint runs and can leave only ignored engine tests in the checkout.
      incrementalSDLSourceAnalysis: false
    sdl:
      eslint:
        enableExclusions: true
        exclusionsFilePath: $(Build.SourcesDirectory)\.eslintignore
      bandit:
        # This repo does not ship any Python code. All .py files are build
        # scripts, test utilities, benchmarks, or external tools (LLVM lit).
        enabled: false

    stages:
    - stage: nuget_publish
      displayName: Nuget publish

      jobs:
      - job: ms_react_native_nuget_job
        displayName: Publish Nuget to ms/react-native-public
        # TEMP: Skip other publishing during the ESRP configuration test.
        condition: eq(1, 0)

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: CI
            artifactName: published-packages
            targetPath: $(Pipeline.Workspace)\published-packages

        steps:
        - script: dir /S $(Pipeline.Workspace)\published-packages
          displayName: Show directory contents

        - task: AzureCLI@2
          displayName: Override NuGet credentials with Managed Identity
          inputs:
            azureSubscription: 'Office-Hermes-Windows-Bot'
            visibleAzLogin: false
            scriptType: 'pscore'
            scriptLocation: 'inlineScript'
            inlineScript: |
              $accessToken = az account get-access-token --query accessToken --resource 499b84ac-1321-427f-aa17-267ca6975798 -o tsv
              # Set the access token as a secret, so it doesn't get leaked in the logs
              Write-Host "##vso[task.setsecret]$accessToken"
              # Override the apitoken of the nuget service connection, for the duration of this stage
              Write-Host "##vso[task.setendpoint id=29e4c04c-ae69-4453-b9f3-bfef7a4c8d32;field=authParameter;key=apitoken]$accessToken"

        - task: 1ES.PublishNuGet@1
          displayName: NuGet push to ms/react-native-public
          inputs:
            useDotNetTask: true
            packageParentPath: '$(Pipeline.Workspace)/published-packages'
            packagesToPush: '$(Pipeline.Workspace)/published-packages/Microsoft.JavaScript.Hermes.*.nupkg'
            nuGetFeedType: external
            publishFeedCredentials: 'Nuget - ms/react-native-public'
            externalEndpoint: 'Nuget - ms/react-native-public'
            publishPackageMetadata: true


      - job: nuget_org_job
        displayName: Publish NuGet to nuget.org

        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: CI
            artifactName: published-packages
            targetPath: '$(Pipeline.Workspace)\published-packages'

        steps:
        - script: dir /S $(Pipeline.Workspace)\published-packages
          displayName: Show directory contents

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $source = "$(Pipeline.Workspace)\published-packages"
            $stagingRoot = "$(Agent.TempDirectory)\esrp-nuget"
            $destination = Join-Path $stagingRoot 'react-native-windows'
            $expectedIds = @(
              'Microsoft.JavaScript.Hermes',
              'Microsoft.JavaScript.Hermes.Fat'
            )
            $packages = @(
              Get-ChildItem -LiteralPath $source -Filter '*.nupkg' -File
            )
            if ($packages.Count -ne $expectedIds.Count) {
              throw "Expected exactly two Hermes NuGet packages."
            }
            $packageIds = @()
            $version = $null
            foreach ($package in $packages) {
              $archive = [System.IO.Compression.ZipFile]::OpenRead(
                $package.FullName
              )
              try {
                $nuspecs = @(
                  $archive.Entries |
                    Where-Object { $_.FullName -like '*.nuspec' }
                )
                if ($nuspecs.Count -ne 1) {
                  throw "Expected one nuspec in $($package.Name)."
                }
                $reader = [System.IO.StreamReader]::new($nuspecs[0].Open())
                try {
                  $metadata = ([xml]$reader.ReadToEnd()).package.metadata
                } finally {
                  $reader.Dispose()
                }
                $id = [string]$metadata.id
                $packageVersion = [string]$metadata.version
                if ($id -notin $expectedIds -or $id -in $packageIds) {
                  throw "Unexpected or duplicate NuGet package ID: $id"
                }
                if ([string]::IsNullOrWhiteSpace($packageVersion)) {
                  throw "Missing NuGet version in $($package.Name)."
                }
                if ($null -ne $version -and $version -cne $packageVersion) {
                  throw "The Hermes NuGet package versions do not match."
                }
                if ($null -eq $archive.GetEntry('.signature.p7s')) {
                  throw "Missing NuGet signature in $($package.Name)."
                }
                $packageIds += $id
                $version = $packageVersion
              } finally {
                $archive.Dispose()
              }
            }
            New-Item -ItemType Directory -Path $destination | Out-Null
            foreach ($package in $packages) {
              Copy-Item -LiteralPath $package.FullName -Destination $destination
              $copy = Join-Path $destination $package.Name
              $originalHash = (Get-FileHash -LiteralPath $package.FullName).Hash
              if ($originalHash -ne (Get-FileHash -LiteralPath $copy).Hash) {
                throw "Staged NuGet package differs: $($package.Name)"
              }
            }
            Write-Host "Prepared two Hermes packages, version $version."
          displayName: Validate and stage signed Hermes NuGet packages

        - task: EsrpRelease@14
          displayName: ESRP Release to NuGet.org
          condition: and(succeeded(), eq('${{ parameters.enableEsrpNuGetPublishing }}', 'True'))
          inputs:
            connectedservicename: 'ESRP-JSHost3'
            usemanagedidentity: false
            keyvaultname: 'OGX-JSHost-KV'
            authcertname: 'OGX-JSHost-Auth4'
            signcertname: 'OGX-JSHost-Sign3'
            clientid: '0a35e01f-eadf-420a-a2bf-def002ba898d'
            domaintenantid: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
            intent: 'PackageDistribution'
            contenttype: 'NuGet'
            organizationname: 'react-native-windows'
            contentsource: 'Folder'
            folderlocation: '$(Agent.TempDirectory)\esrp-nuget\react-native-windows'
            waitforreleasecompletion: true
            owners: 'vmorozov@microsoft.com'
            approvers: 'khosany@microsoft.com'
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: 'ESRPRELPACMAN'
