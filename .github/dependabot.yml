version: 2
# Resolve npm/yarn updates through the ms/react-native-public feed (a public,
# anonymous-read proxy of npmjs.org) so regenerated lockfiles stay feed-pinned.
registries:
  react-native-public:
    type: npm-registry
    url: https://pkgs.dev.azure.com/ms/react-native/_packaging/react-native-public/npm/registry/
    # Public feed; no credentials needed.
    replaces-base: true
updates:
- package-ecosystem: npm
  registries:
  - react-native-public
  directories:
  - "/"
  - "/.ado/scripts"
  - "/benchmarks/build-helpers/flow-bundler"
  - "/benchmarks/raytracer/original"
  - "/tools/fork-sync"
  - "/tools/hcdp"
  - "/tools/hermes-parser/js"
  - "/unittests/NodeApi/test"
  - "/utils/promise"
  - "/utils/scripts/hermes"
  schedule:
    interval: weekly
    day: "monday"
    time: "05:00"
    timezone: "America/Los_Angeles"
  labels:
  - dependencies
  versioning-strategy: lockfile-only
  commit-message:
    prefix: 📦
  open-pull-requests-limit: 5
  groups:
    all-npm-dependencies:
      patterns:
      - "*"
