name: Post Benchmark Results

# Runs after the Benchmarks workflow completes. Uses workflow_run so
# the GITHUB_TOKEN is scoped to the base repo and can write PR comments
# even when the PR comes from a fork.
on:
  workflow_run:
    workflows: ['Benchmarks']
    types: [completed]

jobs:
  comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Download benchmark results artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-results
          path: results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact comes from the PR's own copy of the Benchmarks workflow,
      # so its contents are untrusted: accept only a plain PR number.
      - name: Read PR number
        id: pr
        run: |
          if [ ! -f results/pr-number.txt ]; then
            echo "No PR number file found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(tr -d '[:space:]' < results/pr-number.txt)
          if ! [[ "$number" =~ ^[0-9]{1,10}$ ]]; then
            echo "::warning::Invalid PR number in artifact — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Read markdown report
        id: report
        if: steps.pr.outputs.skip != 'true'
        run: |
          if [ ! -f results/bench_report.md ]; then
            echo "No bench_report.md found — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: steps.pr.outputs.skip != 'true' && steps.report.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hermes-benchmark-results -->';
            const prNumber = Number(process.env.PR_NUMBER);

            // Only comment on the PR whose head commit was benchmarked, so a
            // forged PR number cannot target another PR.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const headSha = context.payload.workflow_run.head_sha;
            if (pr.head.sha !== headSha) {
              core.warning(
                `PR #${prNumber} head ${pr.head.sha} does not match the ` +
                  `benchmarked commit ${headSha}; skipping.`,
              );
              return;
            }

            const markdown = fs.readFileSync('results/bench_report.md', 'utf-8');
            const body = `${marker}\n${markdown}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment (id: ${existing.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info('Created new comment');
            }
