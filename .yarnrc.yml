nodeLinker: node-modules
# Do not add npmRegistryServer or credentials. Dependabot reads this file and
# cannot reach PackageFeedProxy; see "Package feeds" in .ado/scripts/README.md.
# PackageFeedProxy holds new upstream versions for roughly 7 days. Keep an extra
# day's margin, aligned with the Dependabot npm cooldown.
npmMinimalAgeGate: "8d"
yarnPath: .yarn/releases/yarn-4.13.0.cjs